name: ESP32 firmware validation
on: [push, pull_request]
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/check_contract.py
      - run: python3 tests/host/run_replay.py --baseline
      - run: python3 tests/host/run_replay.py
      - run: python3 tests/host/run_replay.py --diagnostics
      - run: python3 tests/host/compare_v229.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/host/diagnostics.cpp -o /tmp/biofit_diag && /tmp/biofit_diag
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/host/lift_cycle.cpp -o /tmp/biofit_lift && /tmp/biofit_lift
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/host/phase_evidence.cpp -o /tmp/biofit_phase && /tmp/biofit_phase
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        side: [Izquierdo, Derecho]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "GFX Library for Arduino@1.6.9"
      - name: Compile only (no upload, no NVS access)
        shell: bash
        run: |
          sketch=$(find "Firmware/Tobillo_${{ matrix.side }}" -name '*.ino' -print -quit)
          arduino-cli compile --fqbn esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc "$(dirname "$sketch")"
